<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Envies V4, page liste mobile</title>

</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&amp;family=Instrument+Sans:wght@400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B2416}
button,input,select{font-family:inherit}
.v4m-bokeh{background:#2A3014 url(../../public/textures/bokeh-mobile.jpg) center/cover no-repeat}
.v4m-plaster{background:#EFE6D3 url(../../public/textures/plaster-cream.jpg) 0 0/520px repeat}
.v4m-grain{background:url(../../public/textures/grain.png) 0 0/200px repeat}
.v4m-cream{background:#F3EDE2}
.v4m-grainfine{background:url(../../public/textures/grain-fine.png) 0 0/200px repeat}
.v4m-photo{background:#EEE6D6 url(../../public/textures/photo-backdrop.jpg) center/cover}
</style>

<div class="v4m-cream" style="width: 390px; height: 844px; box-sizing: border-box; color: #2B2416; font-family: 'Instrument Sans', 'Helvetica Neue', system-ui, sans-serif; overflow: hidden; position: relative">
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
<symbol id="l-heart" viewBox="0 0 24 24"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"></path></symbol>
<symbol id="l-share" viewBox="0 0 24 24"><path d="M12 2v13"></path><path d="m16 6-4-4-4 4"></path><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path></symbol>
<symbol id="l-pencil" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></symbol>
<symbol id="l-arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></symbol>
<symbol id="l-sliders" viewBox="0 0 24 24"><path d="M10 5H3"></path><path d="M12 19H3"></path><path d="M14 3v4"></path><path d="M16 17v4"></path><path d="M21 12h-9"></path><path d="M21 19h-5"></path><path d="M21 5h-7"></path><path d="M8 10v4"></path><path d="M8 12H3"></path></symbol>
<symbol id="leaf" viewBox="0 0 100 40"><path d="M2 20 C 22 2, 62 0, 98 20 C 62 40, 22 38, 2 20 Z"></path><path d="M2 20 L 92 20"></path><path d="M30 20 L 42 11 M50 20 L 62 10 M30 20 L 42 29 M50 20 L 62 30"></path></symbol>
</svg>

<section class="v4m-bokeh" style="position: relative; height: 470px; color: #F3ECDD; overflow: hidden">
<div class="v4m-grain" aria-hidden="true" style="position: absolute; inset: 0; opacity: 0.55; mix-blend-mode: overlay"></div>
<svg aria-hidden="true" width="170" height="360" viewBox="0 0 420 760" style="position: absolute; right: -20px; top: 56px; fill: none; stroke: #F3ECDD; stroke-width: 2.2; stroke-linecap: round; opacity: 0.5">
<path d="M330 0 C 280 150, 350 290, 270 450 S 210 650, 250 760"></path>
<g transform="translate(318 60) rotate(200)"><use href="#leaf" width="110" height="44" x="0" y="-22"></use></g>
<g transform="translate(320 200) rotate(170)"><use href="#leaf" width="120" height="48" x="0" y="-24"></use></g>
<g transform="translate(312 270) rotate(10)"><use href="#leaf" width="104" height="42" x="0" y="-21"></use></g>
<g transform="translate(288 360) rotate(190)"><use href="#leaf" width="124" height="50" x="0" y="-25"></use></g>
<g transform="translate(270 440) rotate(-30)"><use href="#leaf" width="96" height="38" x="0" y="-19"></use></g>
</svg>
<div style="position: relative; display: flex; justify-content: space-between; align-items: center; padding: 8px 12px">
<a href="#" aria-label="Toutes les listes" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(243, 236, 221, 0.4); box-sizing: border-box; background: rgba(243, 236, 221, 0.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: #F3ECDD; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><use href="#l-arrow-left"></use></svg></a>
<span style="font-family: 'Fraunces', Georgia, serif; font-style: italic; font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 72; font-size: 26px">Envies</span>
<div style="display: flex; gap: 8px">
<button type="button" aria-label="Partager la liste" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(243, 236, 221, 0.4); background: rgba(243, 236, 221, 0.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: #F3ECDD; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><use href="#l-share"></use></svg></button>
<button type="button" aria-label="Modifier la liste" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #F3ECDD; color: #2B2416; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.5)"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><use href="#l-pencil"></use></svg></button>
</div>
</div>
<div style="position: absolute; left: 20px; right: 20px; bottom: 64px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #E3D7B8">La liste de Merin</span>
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 400; font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 144; font-size: 84px; line-height: 0.86; letter-spacing: -0.03em; text-shadow: 0 10px 34px rgba(10, 12, 4, 0.45)">Mes<br><i style="font-weight: 300">30 ans</i></h1>
<span style="margin-top: 6px; font-size: 14px; color: #EADFC6">24 articles · 6 coups de cœur · ≈ 1 240 €</span>
</div>
</section>

<div style="position: relative; margin: -30px 12px 0; display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 18px; border-radius: 22px; background: rgba(243, 236, 221, 0.82); border: 1px solid rgba(255, 255, 255, 0.55); backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 20px 40px -20px rgba(43, 36, 22, 0.5)">
<nav aria-label="Catégories" style="flex: 1; min-width: 0; display: flex; gap: 20px; overflow-x: auto; white-space: nowrap">
<button type="button" aria-pressed="true" style="flex: none; height: 44px; padding: 0; border: 0; border-bottom: 2px solid #A76A19; background: transparent; color: #2B2416; font-size: 15px; font-weight: 700">Tout</button>
<button type="button" aria-pressed="false" style="flex: none; height: 44px; padding: 0; border: 0; background: transparent; color: #5E523A; font-size: 15px; font-weight: 600">Maison</button>
<button type="button" aria-pressed="false" style="flex: none; height: 44px; padding: 0; border: 0; background: transparent; color: #5E523A; font-size: 15px; font-weight: 600">Lecture</button>
<button type="button" aria-pressed="false" style="flex: none; height: 44px; padding: 0; border: 0; background: transparent; color: #5E523A; font-size: 15px; font-weight: 600">Musique</button>
</nav>
<button type="button" style="flex: none; height: 44px; padding: 0 14px; border-radius: 16px; border: 0; background: #2B2416; color: #F3ECDD; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round"><use href="#l-sliders"></use></svg>Filtres</button>
</div>

<section style="padding: 26px 16px 0">
<div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px">
<h2 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 400; font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 144; font-size: 42px; line-height: 1; letter-spacing: -0.02em">Maison <i style="font-weight: 300; color: #A76A19">&amp; déco</i></h2>
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #6B5A3E">8</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 14px">
<a href="#" style="display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: #2B2416">
<span class="v4m-photo" style="position: relative; height: 210px; border-radius: 16px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 18px 30px -14px rgba(60, 40, 10, 0.45)"><span style="position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%; background: rgba(243, 236, 221, 0.75); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" role="img" aria-label="Coup de cœur" style="fill: #8E3B22"><use href="#l-heart"></use></svg></span></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 500; line-height: 1.3">Lampe champignon en verre</span><b style="font-family: 'Fraunces', Georgia, serif; font-size: 18px; font-weight: 500">89 €</b></span>
</a>
<a href="#" style="display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: #2B2416">
<span class="v4m-photo" style="position: relative; height: 210px; border-radius: 16px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 18px 30px -14px rgba(60, 40, 10, 0.45)"></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 500; line-height: 1.3">Fauteuil en rotin</span><b style="font-family: 'Fraunces', Georgia, serif; font-size: 18px; font-weight: 500">240 €</b></span>
</a>
</div>
</section>
<div aria-hidden="true" style="position: absolute; right: -180px; top: 420px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(closest-side, rgba(214, 160, 70, 0.2), rgba(214, 160, 70, 0)); pointer-events: none"></div>
<div class="v4m-grainfine" aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none"></div>
</div>


</body>
</html>
